name: Windows Portable v4.0.2

on:
  workflow_dispatch:
  push:
    branches:
      - "windows/**"
      - "codex/windows/**"
    paths:
      - "desktop/**"
      - "app/src/main/java/br/com/monitordenoticias/android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/windows-portable.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "app/src/main/java/br/com/monitordenoticias/android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: write

jobs:
  portable:
    name: Build Windows Portable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify desktop project
        shell: pwsh
        run: |
          if (!(Test-Path "settings.gradle.kts")) {
            throw "settings.gradle.kts was not found in the repository root."
          }

          if (!(Test-Path "desktop")) {
            throw "The desktop/ project was not found. The Windows portable build requires the desktop Gradle module."
          }

      - name: Build Windows app image
        shell: pwsh
        run: |
          gradle :desktop:createDistributable --stacktrace

      - name: Verify and create portable ZIP
        shell: pwsh
        run: |
          $root = "desktop\build\compose\binaries\main\app"

          if (!(Test-Path $root)) {
            throw "Compose app image was not generated: $root"
          }

          $appDir = Get-ChildItem $root -Directory | Select-Object -First 1

          if ($null -eq $appDir) {
            throw "Portable application directory not found inside: $root"
          }

          $exe = Get-ChildItem $appDir.FullName -Filter *.exe -Recurse | Select-Object -First 1

          if ($null -eq $exe) {
            throw "Windows executable not found in app image: $($appDir.FullName)"
          }

          New-Item -ItemType Directory -Force -Path "$($appDir.FullName)\data" | Out-Null

          $zip = "$PWD\monitor-de-noticias-windows-portable-v4.0.2.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$($appDir.FullName)\*" -DestinationPath $zip -Force

          if (!(Test-Path $zip)) {
            throw "Portable ZIP was not generated: $zip"
          }

          $zipInfo = Get-Item $zip

          if ($zipInfo.Length -le 0) {
            throw "Portable ZIP was generated but is empty."
          }

          Write-Host "Portable ZIP generated successfully:"
          $zipInfo | Format-List FullName, Length, LastWriteTime

      # Esta etapa é a que faz o arquivo aparecer na página da execução
      # em Actions > workflow run > Artifacts.
      - name: Upload portable ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-de-noticias-windows-portable-v4.0.2
          path: monitor-de-noticias-windows-portable-v4.0.2.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # Pull requests geram apenas o Artifact acima.
      # Execuções manuais e pushes nas branches Windows também publicam
      # ou atualizam a Release fixa da v4.0.2.
      - name: Publish portable ZIP in Windows prerelease
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           (startsWith(github.ref, 'refs/heads/windows/') ||
            startsWith(github.ref, 'refs/heads/codex/windows/')))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v4.0.2-portable"
          $asset = "monitor-de-noticias-windows-portable-v4.0.2.zip"

          if (!(Test-Path $asset)) {
            throw "Release asset was not found: $asset"
          }

          gh release view $tag *> $null

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating prerelease $tag..."

            gh release create $tag $asset `
              --target "${{ github.sha }}" `
              --title "Monitor de Notícias v4.0.2 — Windows Portable" `
              --notes "Build Windows portable da v4.0.2. O ZIP também fica disponível como Artifact na execução do GitHub Actions." `
              --prerelease
          }
          else {
            Write-Host "Updating prerelease $tag..."
            gh release upload $tag $asset --clobber
          }

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Windows Portable v4.0.2"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if (Test-Path "monitor-de-noticias-windows-portable-v4.0.2.zip") {
            $size = (Get-Item "monitor-de-noticias-windows-portable-v4.0.2.zip").Length
            Add-Content $env:GITHUB_STEP_SUMMARY "✅ ZIP gerado com sucesso."
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "**Arquivo:** monitor-de-noticias-windows-portable-v4.0.2.zip"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "**Tamanho:** $size bytes"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "O download fica disponível na seção **Artifacts** desta execução."
          }
          else {
            Add-Content $env:GITHUB_STEP_SUMMARY "❌ O ZIP não foi gerado. Consulte os logs das etapas anteriores."
          }
